name: Bug report
description: Report a reproducible Graph Views beta problem.
body:
  - type: markdown
    attributes:
      value: Please use synthetic examples. Redact note paths and screenshots. Do not upload a vault, settings file, credentials or private logs.
  - type: input
    id: versions
    attributes:
      label: Versions and operating system
      description: Graph Views version, exact Obsidian version and operating system.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include the graph mode and a small fictional link example if relevant.
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: recovery
    attributes:
      label: Recovery and other graph plugins
      description: Does disabling Graph Views restore native behavior? Which other graph plugins are enabled?
